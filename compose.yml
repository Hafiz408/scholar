services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Backend runs in Docker; it reaches the host Postgres (pg18 on host port 5000)
      # via host.docker.internal, which Docker Desktop on macOS resolves automatically.
      DATABASE_URL: postgresql://postgres@host.docker.internal:5000/scholar
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # The Next.js /api proxy runs server-side inside this container, so it must
      # reach the backend by its compose service name, not localhost.
      NEXT_PUBLIC_API_URL: http://backend:8000
    command: npm run dev
    # restart: unless-stopped
