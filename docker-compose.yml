version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scholar
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ./backend }
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./data:/app/data"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PAGEINDEX_API_KEY=${PAGEINDEX_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=scholar-v1
      - POSTGRES_URL=postgresql://scholar:scholar@postgres:5432/scholar
      - SQLITE_PATH=/app/data/scholar.db
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: { context: ./frontend }
    ports: ["3000:3000"]
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000]
    depends_on: [backend]
    command: npm run dev

volumes:
  pgdata:
